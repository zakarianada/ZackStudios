name: ChatGPT Pexels Positivity Render

on:
  push:
    branches:
      - chatgpt-pexels-render-20260827
    paths:
      - '.github/workflows/chatgpt-pexels-render.yml'
      - 'tools/pexels_render_audio.py'

permissions:
  contents: read

env:
  OUT: ONE_LIFE_PEXELS_BROLL_30S.mp4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 2

      - name: Download Pexels source clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          urls=(
            'https://videos.pexels.com/video-files/5895608/5895608-uhd_3840_2160_30fps.mp4'
            'https://videos.pexels.com/video-files/9950685/9950685-uhd_4096_2160_25fps.mp4'
            'https://videos.pexels.com/video-files/9259034/9259034-uhd_3840_2160_30fps.mp4'
            'https://videos.pexels.com/video-files/5058739/5058739-uhd_3840_2160_30fps.mp4'
            'https://videos.pexels.com/video-files/9724135/9724135-hd_1440_1080_30fps.mp4'
            'https://videos.pexels.com/video-files/36145888/15328677_3840_2160_25fps.mp4'
            'https://videos.pexels.com/video-files/7815663/7815663-uhd_3840_2160_25fps.mp4'
          )
          for i in "${!urls[@]}"; do
            n=$((i+1))
            echo "Downloading clip $n/7"
            curl -fL --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 900 \
              -A 'Mozilla/5.0' "${urls[$i]}" -o "media/clip${n}.mp4"
            ffprobe -v error -show_entries format=duration,size -of default=nw=1 "media/clip${n}.mp4"
          done

      - name: Build original soundtrack and SFX
        run: python3 tools/pexels_render_audio.py

      - name: Render 30-second B-roll edit
        shell: bash
        run: |
          set -euo pipefail
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          # 7 source clips become 12 energetic shots (repeated with different in-points/speeds).
          ffmpeg -y \
            -ss 0.2 -t 3.0 -i media/clip1.mp4 \
            -ss 0.3 -t 3.0 -i media/clip2.mp4 \
            -ss 0.4 -t 3.0 -i media/clip3.mp4 \
            -ss 0.2 -t 3.0 -i media/clip4.mp4 \
            -ss 0.2 -t 3.0 -i media/clip5.mp4 \
            -ss 0.3 -t 3.0 -i media/clip6.mp4 \
            -ss 0.4 -t 3.0 -i media/clip7.mp4 \
            -ss 3.2 -t 2.6 -i media/clip1.mp4 \
            -ss 3.1 -t 2.6 -i media/clip2.mp4 \
            -ss 3.1 -t 2.6 -i media/clip3.mp4 \
            -ss 3.0 -t 2.6 -i media/clip6.mp4 \
            -ss 3.0 -t 2.6 -i media/clip7.mp4 \
            -i soundtrack.wav \
            -filter_complex "
              [0:v]setpts=PTS/1.08,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.08:saturation=1.08:brightness=-0.015[v0];
              [1:v]setpts=PTS/1.06,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.08:saturation=1.08:brightness=-0.015[v1];
              [2:v]setpts=PTS/1.08,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.08:saturation=1.10:brightness=-0.01[v2];
              [3:v]setpts=PTS/1.04,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.07:saturation=1.08:brightness=-0.015[v3];
              [4:v]setpts=PTS/1.10,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.10:saturation=1.06:brightness=-0.02[v4];
              [5:v]setpts=PTS/1.06,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.07:saturation=1.10:brightness=-0.005[v5];
              [6:v]setpts=PTS/1.04,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.08:saturation=1.08:brightness=-0.01[v6];
              [7:v]setpts=PTS/1.12,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.10:saturation=1.07:brightness=-0.02[v7];
              [8:v]setpts=PTS/1.10,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.09:saturation=1.09:brightness=-0.015[v8];
              [9:v]setpts=PTS/1.12,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.10:saturation=1.10:brightness=-0.015[v9];
              [10:v]setpts=PTS/1.10,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.08:saturation=1.10:brightness=-0.005[v10];
              [11:v]setpts=PTS/1.05,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,eq=contrast=1.08:saturation=1.08:brightness=-0.01[v11];
              [v0][v1][v2][v3][v4][v5][v6][v7][v8][v9][v10][v11]concat=n=12:v=1:a=0,
              trim=duration=30,setpts=PTS-STARTPTS,
              vignette=PI/5,
              drawbox=x=0:y=0:w=iw:h=72:color=black@0.22:t=fill,
              drawbox=x=0:y=ih-72:w=iw:h=72:color=black@0.22:t=fill,
              drawtext=fontfile=${FONT}:text='ONE LIFE':fontsize=92:fontcolor=white:x=70:y=h*0.58:enable='between(t,0.2,2.3)':alpha='if(lt(t,0.45),(t-0.2)/0.25,if(gt(t,2.0),(2.3-t)/0.3,1))',
              drawtext=fontfile=${FONT}:text='BREATHE':fontsize=82:fontcolor=white:x=70:y=h*0.58:enable='between(t,2.6,5.0)',
              drawtext=fontfile=${FONT}:text='PUSH':fontsize=108:fontcolor=white:x=70:y=h*0.58:enable='between(t,5.1,7.6)',
              drawtext=fontfile=${FONT}:text='BREAK THROUGH':fontsize=72:fontcolor=white:x=70:y=h*0.58:enable='between(t,7.7,10.1)',
              drawtext=fontfile=${FONT}:text='GO':fontsize=124:fontcolor=white:x=70:y=h*0.58:enable='between(t,12.6,15.0)',
              drawtext=fontfile=${FONT}:text='ALIVE':fontsize=108:fontcolor=white:x=70:y=h*0.58:enable='between(t,17.6,20.0)',
              drawtext=fontfile=${FONT}:text='AGAIN':fontsize=108:fontcolor=white:x=70:y=h*0.58:enable='between(t,20.1,22.5)',
              drawtext=fontfile=${FONT}:text='RISE':fontsize=118:fontcolor=white:x=70:y=h*0.58:enable='between(t,22.6,25.0)',
              drawtext=fontfile=${FONT}:text='KEEP MOVING.':fontsize=84:fontcolor=white:x=(w-text_w)/2:y=(h-text_h)/2:enable='between(t,27.2,30)',
              fade=t=in:st=0:d=0.15,fade=t=out:st=29.6:d=0.4[outv]
            " \
            -map '[outv]' -map 12:a \
            -t 30 -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart "$OUT"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$OUT"

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: one-life-pexels-broll-30s
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 3
